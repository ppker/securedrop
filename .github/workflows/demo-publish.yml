---
name: Publish Demo

on:
  push:
    branches: ["develop"]
    tags: ["**"]  # run for all tags

jobs:
  build:
    name: Build
    uses: freedomofpress/actionslib/.github/workflows/oci-build.yaml@main
    strategy:
      matrix:
        debian:
        - noble
    permissions:
      contents: read
      actions: read
      packages: write
    with:
      context: "."
      containerfile: securedrop/dockerfiles/${{ matrix.debian }}/python3/DemoDockerfile
      registry: ghcr.io/freedomofpress/securedrop-demo-${{ matrix.debian }}
      add-branch-tags: true
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  notify:
    uses: freedomofpress/actionslib/.github/workflows/update-k8s-trigger.yaml@main
    needs:
    - build
    if: ${{ needs.build.result == 'success' }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
    with:
      trigger: sdo-demo/production
      sha: ${{ github.sha }}
    secrets:
      local-token: ${{ secrets.GITHUB_TOKEN }}
      k8s-configs-token: ${{ secrets.K8S_CONFIGS_GITHUB_TOKEN }}
